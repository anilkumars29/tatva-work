# Render Blueprint for the Tatva server (server/). Render reads this file from
# the repo root: Dashboard -> New -> Blueprint -> pick this repo.
# Secrets are `sync: false`: Render asks for their values when the Blueprint is
# created (paste them from server/.env.render, made by `node scripts/deploy-env.mjs`).
services:
  - type: web
    name: tatva-server
    runtime: node
    region: singapore
    # Measured ~340 MB peak (embedding model loaded) and ~220-270 MB steady.
    # starter = 512 MB, always on (no sleep). See docs/DEPLOY.md before choosing free.
    plan: starter
    rootDir: server
    # pnpm comes from package.json "packageManager" via Corepack. Dev dependencies
    # are needed for the build (TypeScript); the embedding model is downloaded
    # here so the first start doesn't fetch ~90 MB.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build && pnpm run prefetch:model
    # Same as `pnpm start`, minus the pnpm wrapper process (~40 MB less RAM).
    startCommand: node --enable-source-maps dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TZ_DISPLAY
        value: Asia/Kolkata
      # Database, models, actions
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      # Voice agent: Agora sends this as the Bearer key (= CUSTOM_LLM_API_KEY on Vercel)
      - key: VOICE_LLM_API_KEY
        sync: false
      - key: DEMO_OWNER_EMAIL
        sync: false
      # Security: shared with Vercel
      - key: TATVA_SERVER_KEY
        sync: false
      - key: TATVA_ACCESS_CODE
        sync: false
      # CORS: the Vercel URL, e.g. https://tatva-work.vercel.app (comma-separated)
      - key: WEB_ORIGINS
        sync: false
