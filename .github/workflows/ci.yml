name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  verify:
    name: verify (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create stub .env.local for doctor
        run: |
          printf '%s\n' \
            'NEXT_PUBLIC_AGORA_APP_ID=0123456789abcdef0123456789abcdef' \
            'NEXT_AGORA_APP_CERTIFICATE=fedcba9876543210fedcba9876543210' \
            'MURF_API_KEY=test-murf-api-key' \
            'MURF_VOICE_ID=test-murf-voice-id' \
            'MURF_VOICE_STYLE=Conversational' \
            > .env.local

      - name: Verify (lint + typecheck + api-contracts + build)
        run: pnpm run verify
